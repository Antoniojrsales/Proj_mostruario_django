            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Links de Navegação -->
        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center">
                <li class="nav-item"><a class="nav-link" href="#hero">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="#destaques">Destaques</a></li>
                <li class="nav-item"><a class="nav-link" href="#catalogo">Produtos</a></li>
                
                <!-- Botão do Carrinho -->
                <li class="nav-item ms-lg-3 me-lg-2">
                    <button class="btn btn-light position-relative" type="button" id="btn-abrir-carrinho">
                        <i class="fa-solid fa-cart-shopping fs-5 text-dark"></i>
                        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" id="contador-carrinho">
                            0
                        </span>
                    </button>

                <!-- Divisor visual -->
                <li class="nav-item d-none d-lg-block"><span class="nav-link text-muted">|</span></li>
                
                <!-- Lógica de Autenticação do Django Embutida na Navbar -->
                {% if request.user.is_authenticated %}
                    <!-- Botões exibidos QUANDO LOGADO -->
                    <li class="nav-item ms-lg-2">
                        <button class="btn btn-success btn-sm fw-bold" data-bs-toggle="modal" data-bs-target="#cadastroProdutoModal">
                            <i class="fa-solid fa-plus me-1"></i> Novo Produto
                        </button>
                    </li>
                    <li class="nav-item ms-lg-2">
                        <a href="{% url 'logout_lojista' %}" class="btn btn-danger btn-sm" title="Sair" onclick="window.location.href=this.href; return false">
                            <i class="fa-solid fa-right-from-bracket"></i>

                {% else %}
                    <!-- Botão exibido QUANDO DESLOGADO -->
                    <li class="nav-item ms-lg-2">

<!-- Modal de Login -->
<div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-sm modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-light">
                <h5 class="modal-title fs-6 fw-bold" id="loginModalLabel">Acesso Restrito</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form method="POST" action="{% url 'login_lojista' %}">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label small">Usuário</label>
                        <input type="text" name="username" id="admin-user" class="form-control form-control-sm" placeholder="Ex: admin" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small">Senha</label>
                        <input type="password" name="password" id="admin-pass" class="form-control form-control-sm" placeholder="***" required>
                    </div>
                    <button type="submit" id="btn-fazer-login" class="btn btn-dark w-100 btn-sm">Entrar</button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Modal de Cadastro de Produto -->
<div class="modal fade" id="cadastroProdutoModal" tabindex="-1" aria-labelledby="cadastroProdutoLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-success text-white">
                <h5 class="modal-title fs-6 fw-bold" id="cadastroProdutoLabel">Cadastrar Novo Produto</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form method="POST" action="{% url 'cadastrar_produto' %}" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label small">Nome do Produto</label>
                        <input type="text" name="nome" class="form-control form-control-sm" placeholder="Ex: Kit Relação Dominator..." required>
                    </div>
                    <div class="row">
                        <div class="col-6 mb-3">
                            <label class="form-label small">Preço (R$)</label>
                            <input type="number" step="0.01" name="preco" class="form-control form-control-sm" placeholder="84.90" required>
                        </div>
                        <div class="col-6 mb-3">
                            <label class="form-label small">Tag de Destaque</label>
                            <select name="tag" class="form-select form-select-sm">
                                <option value="normal">Normal</option>
                                <option value="destaque_semana">Destaque da Semana</option>
                                <option value="mais_vendidos">Mais vendidos</option>
                                <option value="promocao">Promoção</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small">Imagem do Produto</label>
                        <input type="file" name="imagem" class="form-control form-control-sm" accept="image/*">
                    </div>
                    <button type="submit" class="btn btn-success w-100 btn-sm">Salvar Produto</button>
                </form>
            </div>
        </div>
    </div>
</div>

{% if request.user.is_authenticated %}
    <!-- Script que abre o modal automaticamente SOMENTE após o login -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            var myModal = new bootstrap.Modal(document.getElementById('cadastroProdutoModal'));
            myModal.show();
        });
    </script>
{% endif %}

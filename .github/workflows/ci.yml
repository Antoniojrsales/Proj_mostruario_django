name: CI Pipeline Mostruario

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-lint-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Instalar dependências (Linting)
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Análise de Qualidade de Código (Flake8)
      run: |
        # Para a pipeline parar se houver erros críticos de sintaxe
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Avisos menores não quebram a pipeline (exit-zero)
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Configurar Variáveis de Ambiente
      run: cp .env.example .env

    - name: Subir Infraestrutura (Docker Compose)
      run: docker compose up -d --build

    - name: Executar Testes (Pytest + Coverage)
      run: docker compose exec -T web pytest